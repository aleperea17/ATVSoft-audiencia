# audiencia.atvos.io
# Los puertos tienen que coincidir con BACKEND_PORT y FRONTEND_PORT del .env (8020 y 3020).
#
# proxy_pass SIN URI a propósito: Nginx reenvía el path original.
# /api/webhooks/manychat llega al backend como /api/webhooks/manychat.
# Si el upstream lleva una barra final, Nginx borra /api/webhooks/ y el webhook responde 404.

server {
    listen 80;
    server_name audiencia.atvos.io;

    location /api/webhooks/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
